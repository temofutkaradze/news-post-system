<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Crop picker</title>
<style>:root{--bg:#f4f4f4;--fg:#111}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee}}:root[data-theme="dark"]{--bg:#111;--fg:#eee}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(28px + env(safe-area-inset-bottom,0px))}
#app{max-width:460px;margin:0 auto}
.btn,button{font-size:16px;padding:10px 12px;border:0;background:#f4ff3a;color:#111;font-weight:bold;cursor:pointer;display:inline-block;margin:3px 0;border-radius:6px}
button:disabled{opacity:.4}.st{font-size:13px;opacity:.8;margin-left:6px}
#tabs{display:flex;gap:6px;margin:10px 0 4px}#tabs button{flex:1;background:#777;color:#fff;margin:0}#tabs button.on{background:#f4ff3a;color:#111}
#hint{font-size:13px;opacity:.85;min-height:2.6em;margin-bottom:4px}
#post{position:relative;overflow:hidden;width:100%;aspect-ratio:4/5;background:#222;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:4px;cursor:grab}
#post img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
#cir{position:absolute;overflow:hidden;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff;background:#444;pointer-events:none}
#cut{position:absolute;transform:translate(-50%,-50%);pointer-events:none;display:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:15px;text-align:center;padding:20px;pointer-events:none}
.r{display:flex;align-items:center;gap:8px;font-size:15px;margin:6px 0}.r input[type=range]{flex:1;min-width:0}
.tag{display:flex;gap:6px;align-items:center;margin:4px 0}.tag input{flex:1;min-width:0;font-size:15px;padding:8px}
hr{border:0;border-top:1px solid #8886;margin:12px 0}</style></head><body><div id="app">
<div><label class="btn">1 · Background photo<input type="file" id="fb" accept="image/*" hidden></label><span class="st" id="sb">no photo yet</span></div>
<div><label class="btn">2 · Circle photo<input type="file" id="fc" accept="image/*" hidden></label><span class="st" id="sc">no photo yet</span></div>
<div id="tabs"><button data-m="p" class="on">Move circle</button><button data-m="c">Circle photo</button><button data-m="b">Background</button></div>
<div id="hint"></div>
<div id="post"><img id="bgi"><div id="cir"><img id="ci"></div><div id="cut"><img id="cuti"></div><div id="empty">Upload a background photo and a circle photo above</div></div>
<div class="r"><span>circle size</span><input type="range" id="sz" min="15" max="80" step="1"></div>
<div class="r" id="zr"><span>zoom</span><input type="range" id="z" min="1" max="4" step="0.05"></div>
<hr>
<b>Pop-out</b> <small>(head / hands leave the circle)</small><br>
<button id="rm">Remove background</button> <label class="btn">Upload cutout PNG<input type="file" id="cf" accept="image/png" hidden></label> <button id="sv" disabled>Save / share PNG</button>
<div class="r"><label><input type="checkbox" id="pop"> Pop-out on</label></div>
<div class="r"><span>pop-out height</span><input type="range" id="cl" min="10" max="100" step="1"></div>
<div class="st" id="stp" style="margin:0"></div>
<hr>
<div class="tag"><input id="ob" readonly><button data-cp="ob">Copy</button></div>
<div class="tag"><input id="oc" readonly><button data-cp="oc">Copy</button></div>
<button id="cpa">Copy both</button>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var S={b:{fx:.5,fy:.5,z:1,src:''},c:{fx:.5,fy:.3,z:1,sz:40,px:30,py:22,src:'',pop:0,cl:50,file:null,cut:'',cutBlob:null}},M='p';
var HINT={p:'Drag anywhere on the post to move the circle. Pinch (or the slider) to resize it.',c:'Drag to move the photo inside the circle. Pinch (or zoom slider) to zoom it.',b:'Drag to move the background photo. Pinch (or zoom slider) to zoom it.'};
function cl(v,a,b){return Math.min(b,Math.max(a,v))}
function ss(el,src){if(src){if(el.getAttribute('src')!==src)el.src=src}else if(el.getAttribute('src')){el.removeAttribute('src')}}
function fit(img,W,H,f){if(!img.naturalWidth||!W)return;
 var s=Math.max(W/img.naturalWidth,H/img.naturalHeight)*f.z,dw=img.naturalWidth*s,dh=img.naturalHeight*s;
 img.style.width=dw+'px';img.style.height=dh+'px';
 img.style.left=Math.min(0,Math.max(W-dw,W/2-f.fx*dw))+'px';img.style.top=Math.min(0,Math.max(H-dh,H/2-f.fy*dh))+'px'}
['bgi','ci','cuti'].forEach(function(i){$(i).onload=draw});

/* ---- Loading photos ---- */
function toSrc(file){return new Promise(function(ok,no){
 function tryUrl(u,fail){var im=new Image();im.onload=function(){ok({src:u,w:im.naturalWidth,h:im.naturalHeight})};im.onerror=fail;im.src=u}
 var u;try{u=URL.createObjectURL(file)}catch(e){u=''}
 function viaData(){var r=new FileReader();r.onload=function(){tryUrl(r.result,function(){no(new Error('browser cannot display this image'))})};r.onerror=function(){no(new Error('cannot read the file'))};r.readAsDataURL(file)}
 if(u)tryUrl(u,viaData);else viaData()})}
function load(k,file){if(!file)return;var st=$(k==='b'?'sb':'sc');st.textContent='loading...';
 toSrc(file).then(function(r){var o=S[k];o.src=r.src;o.fx=.5;o.fy=k==='c'?.3:.5;o.z=1;
  if(k==='c'){o.file=file;o.cut='';o.cutBlob=null;o.pop=0;say('')}
  st.textContent='✓ '+file.name+' ('+r.w+'×'+r.h+')';draw()})
 .catch(function(e){st.textContent='✗ '+e.message+' ['+(file.type||'unknown type')+', '+Math.round(file.size/1024)+' KB]'})}
$('fb').onchange=function(e){load('b',e.target.files[0]);e.target.value=''};
$('fc').onchange=function(e){load('c',e.target.files[0]);e.target.value=''};

/* ---- modes ---- */
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){M=b.dataset.m;
 document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});draw()}});
$('sz').oninput=function(){S.c.sz=+$('sz').value;draw()};
$('z').oninput=function(){(M==='b'?S.b:S.c).z=+$('z').value;draw()};
$('cl').oninput=function(){S.c.cl=+$('cl').value;draw()};
$('pop').onchange=function(){S.c.pop=$('pop').checked?1:0;if(S.c.pop&&!S.c.cut){say('Remove background or upload a cutout PNG first');S.c.pop=0}draw()};

/* ---- touch / mouse on the post: drag + pinch + wheel ---- */
var ptr={},p0=1,s0=1;
function dist(){var k=Object.keys(ptr);if(k.length<2)return 1;var a=ptr[k[0]],b=ptr[k[1]];return Math.hypot(a.x-b.x,a.y-b.y)||1}
function cur(){return M==='p'?S.c.sz:(M==='c'?S.c.z:S.b.z)}
function setScale(v){if(M==='p')S.c.sz=cl(v,15,80);else (M==='c'?S.c:S.b).z=cl(v,1,4)}
var P=$('post');
P.addEventListener('pointerdown',function(e){try{P.setPointerCapture(e.pointerId)}catch(_){}
 ptr[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(ptr).length===2){p0=dist();s0=cur()}e.preventDefault()});
P.addEventListener('pointermove',function(e){var o=ptr[e.pointerId];if(!o)return;var n=Object.keys(ptr).length,dx=e.clientX-o.x,dy=e.clientY-o.y;
 ptr[e.pointerId]={x:e.clientX,y:e.clientY};
 if(n===1){var pw=P.clientWidth,ph=P.clientHeight;
  if(M==='p'){S.c.px=cl(S.c.px+dx/pw*100,0,100);S.c.py=cl(S.c.py+dy/ph*100,0,100)}
  else{var f=M==='c'?S.c:S.b,im=$(M==='c'?'ci':'bgi'),dw=parseFloat(im.style.width)||1,dh=parseFloat(im.style.height)||1;
   f.fx=cl(f.fx-dx/dw,0,1);f.fy=cl(f.fy-dy/dh,0,1)}}
 else if(n===2){setScale(s0*dist()/p0)}
 draw();e.preventDefault()});
['pointerup','pointercancel'].forEach(function(t){P.addEventListener(t,function(e){delete ptr[e.pointerId]})});
P.addEventListener('wheel',function(e){e.preventDefault();setScale(cur()*Math.exp(-e.deltaY*.002));draw()},{passive:false});

/* ---- pop-out cutout ---- */
function say(m){$('stp').textContent=m}
function setCut(blob){return toSrc(blob).then(function(r){S.c.cutBlob=blob;S.c.cut=r.src;S.c.pop=1;draw()})}
$('cf').onchange=function(e){var f=e.target.files[0];if(!f)return;setCut(f).then(function(){say('✓ cutout loaded')}).catch(function(er){say('✗ '+er.message)});e.target.value=''};
function shrink(file,max){return toSrc(file).then(function(r){return new Promise(function(ok,no){var im=new Image();
 im.onload=function(){var k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  c.toBlob(function(b){b?ok(b):no(new Error('resize failed'))},'image/jpeg',.95)};
 im.onerror=function(){no(new Error('cannot read photo'))};im.src=r.src})})}
var bgLib=null;
$('rm').onclick=async function(){
 if(!S.c.file){say('Upload the circle photo first (button 2)');return}
 var b=$('rm');b.disabled=true;
 try{say('Loading model (first time is slow)...');
  if(!bgLib)bgLib=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
  var rmf=bgLib.removeBackground||bgLib.default,small=await shrink(S.c.file,1600),mobile=matchMedia('(pointer:coarse)').matches;
  var blob=await rmf(small,{model:mobile?'isnet_quint8':'isnet_fp16',output:{format:'image/png'},
   progress:function(k,c,t){if(t)say((/fetch/.test(k)?'Downloading ':'Processing ')+Math.round(c/t*100)+'%')}});
  await setCut(blob);say('✓ done')}
 catch(err){console.error(err);var m=String(err&&err.message||err);
  say(/DataCloneError|postMessage/.test(m)?'This button cannot run inside the chat preview. Open the GitHub page link instead (or use "Upload cutout PNG").':'Failed: '+m+'. Use "Upload cutout PNG" instead.')}
 b.disabled=false};
$('sv').onclick=async function(){var bl=S.c.cutBlob;if(!bl)return;var file=new File([bl],'cutout.png',{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}
 var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='cutout.png';document.body.appendChild(a);a.click();a.remove()};

/* ---- render ---- */
function draw(){var pw=P.clientWidth,ph=P.clientHeight,d=S.c.sz/100*pw,r=Math.round;
 ss($('bgi'),S.b.src);ss($('ci'),S.c.src);ss($('cuti'),S.c.cut);
 fit($('bgi'),pw,ph,S.b);
 var ci=$('cir');ci.style.width=ci.style.height=d+'px';ci.style.left=S.c.px/100*pw+'px';ci.style.top=S.c.py/100*ph+'px';
 fit($('ci'),d,d,S.c);
 var pe=(S.c.pop&&S.c.cut)?1:0,cu=$('cut');cu.style.display=pe?'block':'none';
 if(pe){cu.style.width=cu.style.height=d+'px';cu.style.left=S.c.px/100*pw+'px';cu.style.top=S.c.py/100*ph+'px';
  cu.style.clipPath='inset(-500% -500% '+(100-S.c.cl)+'% -500%)';fit($('cuti'),d,d,S.c)}
 $('empty').style.display=(S.b.src||S.c.src)?'none':'flex';
 $('hint').textContent=HINT[M];$('zr').style.display=M==='p'?'none':'flex';
 $('sz').value=S.c.sz;$('z').value=(M==='b'?S.b:S.c).z;$('cl').value=S.c.cl;$('pop').checked=!!S.c.pop;$('sv').disabled=!S.c.cutBlob;
 $('ob').value='[b:'+r(S.b.fx*100)+','+r(S.b.fy*100)+','+S.b.z.toFixed(2)+']';
 $('oc').value='[c:'+r(S.c.fx*100)+','+r(S.c.fy*100)+','+S.c.z.toFixed(2)+','+r(S.c.sz)+','+r(S.c.px)+','+r(S.c.py)+','+pe+','+r(S.c.cl)+']'}

/* ---- copy ---- */
function copy(text,btn){var t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();t.setSelectionRange(0,9999);
 try{navigator.clipboard&&navigator.clipboard.writeText(text)}catch(e){}try{document.execCommand('copy')}catch(e){}t.remove();
 var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o},1200)}
document.querySelectorAll('[data-cp]').forEach(function(b){b.onclick=function(){copy($(b.dataset.cp).value,b)}});
$('cpa').onclick=function(){copy($('ob').value+' '+$('oc').value,$('cpa'))};
window.addEventListener('resize',draw);draw();
</script></body></html>
