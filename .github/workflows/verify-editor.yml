name: Verify browser editor
on:
  pull_request:
  push:
    branches: [main, feat/premium-smart-layering]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/core.test.mjs
      - name: Check browser module syntax
        run: for file in docs/js/*.js; do node --check "$file"; done
